<!doctype html><html><body style="margin:0;background:#000"><canvas id="c"></canvas><script>
const c = document.getElementById('c'); c.width = innerWidth; c.height = innerHeight;
const gl = c.getContext('webgl2'); let frames = 0; const t0 = performance.now();
function loop() { gl.clearColor(Math.random() * 0.1, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); frames++; requestAnimationFrame(loop); }
loop(); window.fps = () => frames / ((performance.now() - t0) / 1000);
</script></body></html>
